services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gymhub-network

  backend:
    build: ./backend
    environment:
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - MongoDb__DatabaseName=GymHubDb
      - Jwt__Secret=${JWT_SECRET}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Email__Host=${SMTP_HOST}
      - Email__Port=${SMTP_PORT}
      - Email__Username=${SMTP_USERNAME}
      - Email__Password=${SMTP_PASSWORD}
      - Email__FromAddress=${SMTP_FROM_ADDRESS}
      - Email__FromName=${SMTP_FROM_NAME}
      - Email__UseStartTls=${SMTP_USE_STARTTLS}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - gymhub-network

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    networks:
      - gymhub-network

networks:
  gymhub-network:
    driver: bridge

volumes:
  mongo-data:
  backend-uploads:
